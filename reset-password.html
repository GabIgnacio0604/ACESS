<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - ACESS</title>
  <link rel="stylesheet" href="reset-password.css" />
</head>

<body>
  <!-- Reset Password Section -->
  <div id="ResetPassword">
    <div id="loginBox">
      <img src="Images/School_Logo.jpg" alt="School Logo" id="logo" />
      <h1 id="heading">RESET PASSWORD</h1>
      <p id="subheading">STA. CRUZ HIGHSCHOOL</p>
      
      <div class="password-container">
        <input type="password" id="newPassword" placeholder="New Password (8-16 characters)" />
        <span class="toggle-eye"><i class="fas fa-eye"></i></span>
      </div>
      <div class="error-message" id="newPasswordError" style="display:none;"></div>

      <div class="password-container">
        <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" />
        <span class="toggle-eye"><i class="fas fa-eye"></i></span>
      </div>
      <div class="error-message" id="confirmNewPasswordError" style="display:none;"></div>

      <button id="resetPasswordBtn">Reset Password</button>
      <br><br>
      <p><a href="login.html">Return to Login</a></p>
    </div>
  </div>

  <!-- Success Screen -->
  <div id="successScreen" style="display: none;">
    <div class="card">
      <img src="Images/School_Logo.jpg" alt="School Logo" />
      <h1>Password Reset Successful!</h1>
      <p>Your password has been successfully reset. You can now log in with your new password.</p>
      <a href="login.html" class="back-button">Return To Login Page</a>
    </div>
  </div>

  <!-- JS Files -->
  <script src="JS/validation.js"></script>
  <script src="JS/reset-password.js"></script>
</body>

</html>
