<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Management</title>
  <link rel="stylesheet" href="../CSS/ACESS_AccountManagement.css" />
</head>

<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <a href="ACESS_Admin_Dashboard.html">
        <img src="../Images/School_Logo.jpg" alt="Logo" class="logo" />
      </a>
      <p class="account-name" id="account-name">Loading...</p>
      <nav class="sidebar-nav">
        <a href="ACESS_Admin_Club.html">👥 Club</a>
        <a href="ACESS_Student_Council.html">🏛️ Student Council</a>
        <a href="ACESS_Messages.html">💬 Messages</a>
        <a href="ACESS_AccountManagement.html" class="active">👤 Account Management</a>
      </nav>
      <button class="logout-btn" id="logoutButton">Logout</button>
    </aside>

    <!-- Topbar -->
    <header class="topbar">
      <div class="menu-toggle" id="menuToggle">
        <span></span><span></span><span></span>
      </div>
      <h2>Account Management</h2>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <div class="account-management-container">
        <!-- ✅ Excel Import Section -->
        <div class="excel-import-section">
          <h3>Import LRN Excel File</h3>
          <input type="file" id="excelFile" accept=".xlsx, .xls" />
          <button id="importExcelBtn">📂 Import Excel</button>
        </div>

        <!-- Left Column -->
        <div class="account-lists">
          <section class="list-panel">
            <h3>Sign-Up Application</h3>
            <div class="scrollable-list" id="signup-list"></div>
          </section>

          <section class="list-panel">
            <h3>Account List</h3>
            <div class="scrollable-list" id="account-list"></div>
          </section>
        </div>

        <!-- Right Column -->
        <section class="applicant-info">
          <h3>Applicant Information</h3>
          <form id="applicant-form">
            <div class="form-field">
              <label>Full Name</label>
              <input type="text" id="full-name" />
            </div>
            <div class="form-field">
              <label>Email</label>
              <input type="email" id="email" />
            </div>
            <div class="form-field">
              <label>Password</label>
              <input type="password" id="password" />
            </div>
            <div class="form-field">
              <label>School ID or LRN</label>
              <input type="text" id="school-id" />
            </div>
            <div class="form-field">
              <label>Role</label>
              <select id="role">
                <option value="user">User</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
                <option value="studentcouncil">Student Council</option>
                <option value="superadmin">Super Admin</option>
              </select>
            </div>

            <div class="form-buttons">
              <button type="button" class="accept" id="accept-btn">Accept</button>
              <button type="button" class="reject" id="reject-btn">Reject</button>
              <button type="button" class="save" id="save-btn">Save</button>
              <button type="button" class="delete" id="delete-btn">Delete</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <form id="uploadLRNForm" action="./Php/import_lrn_excel.php" method="post" enctype="multipart/form-data">
    <input type="file" name="excelFile" accept=".xlsx,.xls,.csv" required>
    <button type="submit">Import & Approve</button>
</form>

<div id="result"></div>
  </div>

  <!-- JS -->
  <script src="../JS/session_manager.js"></script>
  <script src="../JS/main.js"></script>
  <script src="../Admin/JS/account_management.js"></script>
  <script>
    document.getElementById('uploadLRNForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    const res = await fetch(this.action, {
        method: 'POST',
        body: formData
    });

    const data = await res.json();
    document.getElementById('result').innerText = data.message;
});
  </script>
</body>
</html>
